<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SarthX - AI-Powered Citizen Welfare Discovery Engine</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8fafc] text-slate-800 min-h-screen selection:bg-emerald-500 selection:text-white font-sans antialiased">
    <div id="root"></div>

    <!-- Hidden Google Translate Element for 100% Full-DOM Translation across 13 Indian Languages -->
    <div id="google_translate_element" style="display:none; position:absolute; top:-9999px; left:-9999px;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,bn,mr,te,ta,gu,kn,ml,pa,or,as,ur',
          autoDisplay: false
        }, 'google_translate_element');
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
